name: sanal-kasa
on:
  schedule:
    - cron: "37 7 * * *"    # her gün ~10:37 TR: önceki kuponları sonuçlandır, bugünün kuponunu kur
    - cron: "17 21 * * *"   # her gece ~00:17 TR: sadece sonuçlandırma
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: oran-takip
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sanal kasa
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KUPON: ${{ github.event.schedule == '17 21 * * *' && '0' || '1' }}
        run: python tools/kasa.py
      - run: |
          git config user.name "oran-takip"
          git config user.email "oran-takip@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "sanal kasa $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -X theirs -q || true
          git push -q || true
