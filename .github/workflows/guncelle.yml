name: elle-guncelle
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: oran-takip
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Güncel oranları oku
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          FORCE_READ: "1"
        run: python takip.py
      - name: Uygulama verisi
        env:
          FORCE: "1"
        run: python tools/canli.py
      - run: |
          git config user.name "oran-takip"
          git config user.email "oran-takip@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "elle güncelleme $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -X theirs -q || true
          git push -q || true
