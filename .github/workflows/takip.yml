name: oran-takip
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: oran-takip
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Oranları oku
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: python takip.py
      - name: Uygulama verisi (6 saatte bir)
        run: python tools/canli.py
      - name: Kaydet
        run: |
          git config user.name "oran-takip"
          git config user.email "oran-takip@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "oran kaydı $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -X theirs -q || true
          git push -q || true
