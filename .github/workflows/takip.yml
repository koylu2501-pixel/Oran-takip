name: oran-takip
on:
  schedule:
    - cron: "7,37 * * * *"   # her 30 dakikada bir (GitHub birkaç dakika geciktirebilir)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: oran-takip
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Oranları oku
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: python takip.py
      - name: Kaydet
        run: |
          git config user.name "oran-takip"
          git config user.email "oran-takip@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "oran kaydı $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q || true
          git push -q || true
