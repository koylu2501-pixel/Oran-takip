name: veri-sayim
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: oran-takip
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/piyasa.py
      - run: |
          git config user.name "oran-takip"
          git config user.email "oran-takip@users.noreply.github.com"
          git add data/piyasa.csv
          git diff --cached --quiet || git commit -m "veri sayımı"
          git pull --rebase -q || true
          git push -q || true
